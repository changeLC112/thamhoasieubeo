 if(U.vol)for(const r of vr)for(let i=0;i<14;i++)S.sh.push({x:x+20-i*30,r,d:U.vol*m});
 if(U.str){const T=ZZ.filter(z=>Math.abs(z.r-p.r)<=1||z.boss);for(let i=0;i<U.str;i++){const t=T[Math.floor(Math.random()*T.length)],px=t?t.x:x+200+Math.random()*700,py=t?Y(t):rowY(vr[Math.floor(Math.random()*vr.length)]);for(const z of ZZ)if(Math.hypot(z.x-px,Y(z)-py)<140)z.hp-=U.sd*m*(z.boss?.4:1);puff(px,py,U.c,18);zone(px,py,90,1,0,U.c)}}
 if(U.rb)for(let i=0;i<U.rb;i++){const px=x+90+i*130;for(const z of ZZ)if(z.r===p.r&&Math.abs(z.x-px)<130)z.hp-=U.sd*m*(z.boss?.4:1);puff(px,y,U.c,16);zone(px,y,80,1.2,0,U.c)}
 if(U.h)for(const q of S.pl)q.hp=Math.min(q.mx||P[q.k].hp,q.hp+(q.mx||P[q.k].hp)*U.h);if(U.inv)S.inv=Math.max(S.inv||0,U.inv);if(U.sun){S.sun+=U.sun;S.ft.push({x,y:y-50,t:0,s:'+'+U.sun+' sen'})}if(U.rd)ready={};
 S.shake=.7;sfx('boom');ui()}

 if(q.k==='fire'||q.k==='lava'){const gr=g.createLinearGradient(x0,0,1340,0);gr.addColorStop(0,'#fff6c0');gr.addColorStop(.25,q.c);gr.addColorStop(1,'rgba(255,60,0,0)');g.fillStyle=gr;g.beginPath();g.moveTo(x0,y-8);g.lineTo(1340,y-CH*1.45);g.lineTo(1340,y+CH*1.45);g.lineTo(x0,y+8);g.closePath();g.globalAlpha=a*.5;g.fill();g.globalAlpha=a;

  if(q.k!=='bolt'){g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<22;i++){g.beginPath();g.arc(x0+((i*61+T*400)%(1340-x0)),y+Math.sin(i*5+T*8)*30,3,0,7);g.fill()}}}
 g.restore()}}

 if(e>1.35&&e<2.1){g.globalAlpha=o*Math.max(0,1-Math.abs(e-1.6)/.3)*.9;g.fillStyle='#fff';g.fillRect(-40,-40,1420,580)}g.restore()}
const CHG=[['3.4','Thêm thành phố, nhân vật và cây phố thị','Thêm 3 thành phố mới (Đà Nẵng, Cần Thơ, Đà Lạt, 9 màn, 3 map riêng, mở sau Chương 4). Thêm 5 cây phố thị: Hoa Sữa, Hoa Phượng, Hoa Giấy, Cây Cà Phê, Cây Chè (mở sau khi qua Hà Nội). Thêm 6 nhân vật: Bác Bảo Vệ, Cô Chợ Nổi, Chú Nông Dân Hoa, Cô Chủ Quán Cà Phê, Bạn Sinh Viên, Nghệ Nhân Đèn Lồng, và các thành phố cũ cũng có thêm người dẫn truyện mới.'],['3.3','Tính năng phụ mới','Nhiệm vụ hằng ngày (5 nhiệm vụ, thưởng hoa sen và Mảnh Long Quân khi làm đủ), bảng kỷ lục Vô Tận top 5, nút chụp ảnh màn hình trong trận, mẹo chơi mỗi ngày ở menu, thêm cài đặt Giảm rung màn hình và Nhắc nghỉ ngơi sau 45 phút.'],['3.2.1','Lịch sử cập nhật ra màn hình chính','Nút Cập nhật nổi bật ở góc trên cùng menu chính, hiện phiên bản mới nhất và nhãn MỚI cho đến khi bạn xem. Bấm vào để đọc toàn bộ lịch sử cập nhật.'],['3.2','Ma quỷ thế giới và cutscene nhận thú cưng','Thêm 8 quái từ truyền thuyết các nước (Kappa, Yurei, Oni của Nhật; Ma Cà Rồng, Banshee, Người Sói của Châu Âu; Xác Ướp Ai Cập; Calavera Mexico), 2 boss (Dracula, Anubis), 4 cây (Hoa Anh Đào, Mandrake, Xương Rồng, Chà Là), Chương 13-14 vòng quanh thế giới (8 màn, 4 map riêng) mở sau khi hạ Diêm Vương. Mỗi thú cưng có cutscene nhận riêng ở cuối chương: Chim Lạc, Rồng Con, Kim Quy, Cá Chép, Gà Thần.'],['3.1','Khung chơi rộng hơn và chế độ điện thoại','Bỏ vùng trống phía dưới, khung chơi phóng to lấp đầy màn hình. Thẻ cây xuống dưới khung (hoặc cột bên cạnh trên màn ngang rất rộng). Khi chọn điện thoại: nhắc xoay ngang, tự bật toàn màn hình, bảng và nút lớn hơn, vùng chạm hạt sáng rộng hơn, chặn thu phóng và cuộn nhầm. Cài đặt có mục cỡ thẻ cây và nút.'],['3.0','Phố đổ nát, tiến hóa 3 và Chương 11-12','Giao diện thành phố chuyển sang phong cách hoang tàn thời đại dịch Âm Binh (khói, sắt gỉ, tòa nhà đổ). Sau khi qua các thành phố: cây nâng được tới cấp 8, tiến hóa dạng 3 bằng đơn vị tiền mới (đổi từ 50 Mảnh Long Quân, có thể đổi tên trong Cài đặt), zombie biến dị mạnh gấp đôi và rơi nhiều mảnh hơn, thêm 3 cây (Sả Thơm, Ngải Cứu, Mít Pháo), 3 quái (Lính Ma, Ma Khóc, Ma Nhân Bản), 2 boss (Dạ Xoa, Diêm Vương) và Chương 11, 12 (8 màn) kết thúc cốt truyện. Nhà phát triển có thêm bảng cài đặt nâng cao.'],['2.8','Giao diện phố thị và nhân vật mới','Sau khi hoàn thành chương Hà Nội, giao diện tự đổi sang phong cách phố thị: nền xanh đêm có đường chân trời tòa nhà, chữ và nút neon hồng xanh, công tắc và thẻ đổi màu. Có thể đổi tay trong Cài đặt (Giao diện). Thêm 3 nhân vật: Cô Hàng Rong, Bác Xích Lô, Anh Shipper, và nhân vật chào ở menu thay đổi theo thành phố đã qua.'],['2.7','Các thành phố Việt Nam','Mở rộng ra ngoài làng Sen với 4 chương thành phố (16 màn): Hà Nội Phố Cổ, Huế Cố Đô, Hội An Phố Đèn Lồng, Sài Gòn Đêm Không Ngủ, mỗi thành phố có map đô thị riêng (nhà ống, Hoàng Thành, đèn lồng, đèn neon). Thêm quái Ma Xe Máy, Ma Biển Quảng Cáo, 3 nhân vật mới (Ông Đồ Phố, Cô Áo Dài, Anh Xe Ôm), 4 câu đố mới và cutscene kết mỗi thành phố. Mở khóa sau khi hoàn thành Chương 3.'],['2.6','Cốt truyện, nhân vật mới và khóa màn phụ','Thêm màn hình Cốt truyện theo tuyến chương với tranh minh họa và lời kể của từng màn. Thêm nhân vật Chim Lạc, Chú Cuội, Thạch Sanh, Mỵ Nương cùng Bà Ba, mỗi chương có người dẫn truyện riêng. Các màn phụ chỉ mở khóa sau khi hoàn thành Chương 2.'],['2.5','Hiệu ứng mới, cân bằng và Chương 6','Làm lại hiệu ứng kỹ năng (sóng xung kích, vết cào, xoáy, cột sáng, trái tim mê hoặc, mái vòm Kim Quy) cho cây, boss và thú cưng. Cân bằng máu boss tăng dần theo chương, giá cây và thú cưng. Thêm 4 cây (Nghệ Vàng, Ổi Ném, Chanh Chua, Măng Tre), 3 quái (Ma Xó, Quỷ Nhập Tràng, Ma Cây Gạo), Chương 6 (5 màn) và 2 màn phụ. Làm lại giao diện Sổ tay, Cài đặt, Cửa hàng.'],['2.4','Chương 5, quái dân gian và cutscene chiến thắng','Chương 5 Sơn Tinh Thủy Tinh (5 màn), 3 màn phụ mới, 4 quái dân gian (Ma Da, Ma Trơi, Ma Lai, Ông Ba Bị) và 2 boss (Ông Ba Mươi, Thủy Tinh) có skill riêng. Cutscene khi hạ boss cuối mỗi chương: boss tan thành ánh sáng cùng đoạn kết truyện.'],['2.3','Map riêng cho màn phụ và giao diện mới','Mỗi màn phụ có map riêng: Chợ Đêm (quầy hàng, đèn lồng treo), Hội Đèn Lồng (dây đèn, cột đèn), Đấu Trường (nền đá, cột trụ, đuốc, cờ), Giấc Mơ (pha lê phát sáng, cánh hoa bay). Làm đẹp lại bảng menu, tiêu đề, nút bấm và nền các bảng.'],['2.2','Màn phụ và câu đố','4 màn phụ có luật chơi riêng (Chợ Đêm không có ánh sen từ trời, Hội Đèn Lồng quái chạy nhanh, hai màn đấu boss liên tiếp) có thưởng lần đầu. Bà Ba ra câu đố dân gian trước các trận boss và màn phụ: đúng thì được phù hộ, sai thì âm khí mạnh lên. Thêm 2 thành tựu mới.'],['2.1.1','Sửa thứ tự màn','Sửa lỗi tên và boss của các màn C2-4, C2-5 và Chương 4 bị lệch nhau.'],['2.1','Giao diện chọn màn mới','Chọn màn chia theo từng chương: mỗi chương một hàng riêng, có tên chương và số màn đã mở.'],['2.0','Chương 4, boss, thú cưng và hiệu ứng','Chương 4 Thạch Sanh Hạ Yêu (4 màn), boss Chằn Tinh và Đại Bàng Tinh, thú cưng Cá Chép và Gà Thần. Hiệu ứng kỹ năng trong trận (sóng trống, mưa sen, lửa quét, băng giá, sấm sét, hồi sinh, mưa vàng). Vẽ lại map: cỏ hoa, bụi cây viền, tường đá bậc thang, sen nở, rừng cây, dòng sông chảy.'],['1.9','Tính năng phụ','Thành tựu có thưởng hoa sen và bảng thống kê (trong Sổ tay), quà đăng nhập mỗi ngày (chuỗi tối đa 7 ngày), sao lưu và nhập tiến trình bằng mã trong Cài đặt.'],['1.8.2','Chiêu đặc biệt kiểu mới','Chiêu đặc biệt của Đá Mẫu Tinh giờ là cảnh quay cận cảnh có thuyết minh, tên chiêu và chớp sáng, rồi cây tấn công theo đường đi của nó (tia nước, phun lửa, sét, lá, nổ dọc hàng...) thay vì quét sạch cả ruộng.'],['1.8.1','Sửa lỗi Đá Mẫu Tinh','Sửa lỗi game bị đứng (PD[sel] is not a function) khi rê chuột lúc đang chọn Đá Mẫu Tinh. Ô cây hợp lệ giờ được viền tím sáng khi rê chuột.'],['1.8','Đá Mẫu Tinh và chiêu đặc biệt','Chế Đá Mẫu Tinh từ 20 Mảnh Long Quân. Dùng trong trận để kích hoạt cutscene và chiêu đặc biệt của từng cây (tối đa 3 viên mỗi trận). Vẽ lại Long Quân Giáng Thế. Thêm trang Lịch sử cập nhật.'],
